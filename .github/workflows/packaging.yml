name: Packaging

# Runs on new tags and manually (workflow_dispatch).

on:
  workflow_dispatch:
  push:
    tags:
      - "*"

jobs:
  # create-release -------------------------------------------------------------
  create-release:
    name: Create release
    runs-on: ubuntu-24.04
    steps:
      - name: Create
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Windows --------------------------------------------------------------------
  windows:
    name: Windows
    runs-on: windows-2022
    timeout-minutes: 60
    needs: create-release
    steps:
      - name: Download repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Generate Makefile
        shell: bash
        run: cmake -S . -B build/ -G "Visual Studio 17 2022" -DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows -DWITH_VST3=ON

      - name: Build
        shell: bash
        run: cmake --build build/ --config Release --parallel

      - name: Make package
        run: bash ./.github/scripts/windows/make-package.sh ${{ github.ref_name }}

      - name: Upload release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: false
          tag_name: ${{ github.ref_name }}
          files: dist/giada-${{ github.ref_name }}-x86_64-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # macOS ----------------------------------------------------------------------
  macos:
    name: macOS
    runs-on: macOS-14
    timeout-minutes: 60
    needs: create-release
    steps:
      - name: Download repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Generate Makefile
        run: cmake -S . -B build/ -G "Xcode" -DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake -DCMAKE_CXX_FLAGS="-x objective-c++" -DWITH_VST3=ON

      - name: Build
        run: cmake --build build/ --config Release --parallel

      - name: Make package
        run: bash ./.github/scripts/macos/make-package.sh ${{ github.ref_name }}

      - name: Upload release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: false
          tag_name: ${{ github.ref_name }}
          files: dist/giada-${{ github.ref_name }}-arm64-macos.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # source ---------------------------------------------------------------------
  source:
    name: Source
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    needs: create-release
    if: github.ref_type == 'tag' # This job needs a tag for the make-src.py script
    steps:
      - name: Download repository
        uses: actions/checkout@v5

      - name: Make source package
        run: python3 ./.github/scripts/make-src.py ${{ github.ref_name }}

      - name: Upload release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: false
          tag_name: ${{ github.ref_name }}
          files: dist/giada-${{ github.ref_name }}-src.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
